# Render Blueprint — deploy full stack from GitHub
# https://dashboard.render.com/select-repo?type=blueprint

services:
  - type: web
    name: alert-streamer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: huggingface
      - key: HF_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: ALERT_STREAMER_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://alert-streamer-web.onrender.com

  - type: web
    name: alert-streamer-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://alert-streamer-api.onrender.com
