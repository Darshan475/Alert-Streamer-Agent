# Render Blueprint — single FastAPI service (API + dashboard)
# https://dashboard.render.com/select-repo?type=blueprint

services:
  - type: web
    name: alert-streamer
    runtime: python
    plan: free
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: huggingface
      - key: HF_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: ALERT_STREAMER_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://alert-streamer.onrender.com
