<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alert Streamer | Incident Dashboard</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">📡</div>
        <div>
          <h1>Alert Streamer</h1>
          <p>LLM investigation · Human-in-the-loop · FastAPI</p>
        </div>
      </div>
      <button type="button" id="btn-refresh" class="btn-secondary">↻ Refresh</button>
    </div>
  </header>

  <main class="main">
    <div id="error-banner" class="error-banner hidden"></div>

    <section id="stats-row" class="stats-row"></section>

    <section class="llm-bar card">
      <label for="llm-select">LLM Engine</label>
      <select id="llm-select"></select>
      <span id="llm-status" class="llm-status"></span>
    </section>

    <div class="grid">
      <div class="col-list">
        <h2 class="section-title">Alert Stream (<span id="alert-count">0</span>)</h2>
        <div id="filter-tabs" class="filter-tabs"></div>
        <div id="alert-list" class="alert-list"></div>
      </div>
      <div class="col-detail">
        <h2 class="section-title">Investigation &amp; Human Review</h2>
        <div id="alert-detail" class="alert-detail empty">
          <p>Select an alert to review LLM investigation</p>
          <p class="muted">P1/P2 require approval · P3+ auto-resolve</p>
        </div>
      </div>
    </div>
  </main>

  <button type="button" id="chat-fab" class="chat-fab" title="Open assistant">💬</button>

  <div id="chat-modal" class="chat-modal hidden">
    <div class="chat-backdrop"></div>
    <div class="chat-panel">
      <div class="chat-header">
        <strong>Alert Assistant</strong>
        <button type="button" id="chat-close" class="btn-icon">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Ask about alerts or human review…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
